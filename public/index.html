<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk STK Push Dispatcher</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; background: #f8f9fa; }
    .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 1.2rem; }
    label { font-weight: 600; display: block; margin-bottom: 0.4rem; }
    input, textarea { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; padding: 0.8rem 1.5rem; font-size: 1rem; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #6c757d; }
    .logs { margin-top: 2rem; background: #1e1e1e; color: #00ff66; padding: 1rem; border-radius: 4px; height: 250px; overflow-y: auto; font-family: monospace; }
    .log-fail { color: #ff5555; }
    .log-info { color: #55ffff; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Bulk STK Push Dispatcher</h2>
    <form id="stkForm">
      <div class="form-group">
        <label for="phoneNumbers">Phone Numbers (One per line or comma-separated)</label>
        <textarea id="phoneNumbers" rows="6" placeholder="254712345678&#10;254787654321" required></textarea>
      </div>
      <div class="form-group">
        <label for="amount">Amount (KES)</label>
        <input type="number" id="amount" placeholder="100" required min="1">
      </div>
      <div class="form-group">
        <label for="reference">External Reference (Optional)</label>
        <input type="text" id="reference" placeholder="batch_order_001">
      </div>
      <button type="submit" id="btnSubmit">Start Bulk Dispatch</button>
    </form>

    <div class="logs" id="logContainer">
      <div class="log-info">[System] Ready to process transactions. Throttled at 30 req/min.</div>
    </div>
  </div>

  <script>
    const form = document.getElementById('stkForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const logContainer = document.getElementById('logContainer');

    function appendLog(message, type = 'normal') {
      const el = document.createElement('div');
      if (type === 'fail') el.className = 'log-fail';
      if (type === 'info') el.className = 'log-info';
      el.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logContainer.appendChild(el);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const rawPhones = document.getElementById('phoneNumbers').value;
      const amount = document.getElementById('amount').value;
      const reference = document.getElementById('reference').value;

      const phoneNumbers = rawPhones.split(/[\n,]+/).map(p => p.trim()).filter(Boolean);

      if (phoneNumbers.length === 0) return alert('Enter at least one phone number');

      btnSubmit.disabled = true;
      appendLog(`Starting processing for ${phoneNumbers.length} numbers...`, 'info');

      try {
        const response = await fetch('/api/bulk-stk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumbers, amount, reference })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.replace('data: ', ''));

              if (data.status === 'SUCCESS') {
                appendLog(`SUCCESS: ${data.phone} | Ref: ${data.reference}`);
              } else if (data.status === 'FAILED') {
                appendLog(`FAILED: ${data.phone} | Error: ${data.error}`, 'fail');
              } else if (data.status === 'COMPLETE') {
                appendLog('Bulk processing completed successfully.', 'info');
              }
            }
          }
        }
      } catch (err) {
        appendLog(`Network/Server Error: ${err.message}`, 'fail');
      } finally {
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
